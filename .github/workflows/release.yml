name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: write

env:
  NIM_VERSION: 2.2.12

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Linux x86_64
    runs-on: ubuntu-24.04

    steps:
      # Pushes to main publish a rolling "release" release and version tags
      # publish a versioned one. Both are marked as the repository's latest
      # release and embed the "latest" update channel, because updaters such
      # as Gear Lever resolve updates only through GitHub's /releases/latest.
      - name: Resolve release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "push" && "$REF_TYPE" == "branch" ]]; then
            {
              echo "tag=release"
              echo "ref=$SHA"
              echo "channel=latest"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          if [[ ! "$tag" =~ ^v[0-9] ]]; then
            echo "Release tags must start with a version such as v0.1.0" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "ref=$tag"
            echo "channel=latest"
          } >> "$GITHUB_OUTPUT"

      - name: Check out release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.ref }}

      - name: Install Nim
        run: |
          curl --fail --show-error --silent \
            https://nim-lang.org/choosenim/init.sh \
            -o /tmp/choosenim-init.sh
          CHOOSENIM_CHOOSE_VERSION="$NIM_VERSION" sh /tmp/choosenim-init.sh -y
          echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.nimble/bin:$PATH"
          nim --version

      - name: Install AppImage build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes file libpcre3

      - name: Run test suite
        run: ./run-tests.sh

      # The AppImage compiles and links programs with a bundled Zig, so the
      # runtime archive it ships is built with that Zig too: objects from the
      # runner's gcc can reference newer glibc symbols than Zig links against.
      - name: Install bundled Zig
        run: |
          appdir=dist/clonim.AppDir
          curl --fail --location --silent --show-error \
            https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz \
            -o /tmp/zig-x86_64-linux-0.15.2.tar.xz
          echo "02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239  /tmp/zig-x86_64-linux-0.15.2.tar.xz" \
            | sha256sum --check
          mkdir -p "$appdir/usr/lib/zig"
          tar --extract --xz --file /tmp/zig-x86_64-linux-0.15.2.tar.xz \
            --strip-components=1 --directory "$appdir/usr/lib/zig"
          install -Dm755 packaging/appimage/gcc "$appdir/usr/bin/gcc"
          ln -s gcc "$appdir/usr/bin/cc"

      - name: Build optimized compiler and runtime archive
        run: |
          nim c -d:release -d:releaseCompiler --hints:off --warnings:off \
            -o:bin/clonim src/clonim.nim
          PATH="$PWD/dist/clonim.AppDir/usr/bin:$PATH" \
            packaging/build-runtime.sh bin/libclonim_runtime.a
          PATH="$PWD/dist/clonim.AppDir/usr/bin:$PATH" \
            packaging/build-repl-host.sh bin/clonim-repl-host

      # The release compiler links programs against the shipped runtime archive
      # rather than building from the runtime sources, so test it separately
      # from the source-built compiler above, with the bundled Zig.
      - name: Run test suite with optimized compiler
        run: |
          PATH="$PWD/dist/clonim.AppDir/usr/bin:$PATH" CLONIM=bin/clonim \
            ./run-tests.sh

      - name: Package release
        env:
          UPDATE_CHANNEL: ${{ steps.release.outputs.channel }}
        run: |
          appdir=dist/clonim.AppDir
          install -Dm755 bin/clonim "$appdir/usr/bin/clonim"
          install -Dm644 bin/libclonim_runtime.a \
            "$appdir/usr/bin/libclonim_runtime.a"
          install -Dm755 bin/clonim-repl-host "$appdir/usr/bin/clonim-repl-host"
          nim_lib=$(nim dump --hints:off 2>&1 | grep '^/.*\/lib$' | tail -n 1)
          test -f "$nim_lib/system.nim" || {
            echo "Unable to locate Nim's library directory" >&2
            exit 1
          }
          nim_root=$(dirname "$nim_lib")
          nim_bin="$nim_root/bin/nim"
          install -Dm755 "$nim_bin" "$appdir/usr/bin/nim"
          cp -a "$nim_lib/." "$appdir/usr/lib/"
          cp -a "$nim_root/config" "$appdir/usr/config"

          install -Dm755 packaging/appimage/AppRun "$appdir/AppRun"
          install -Dm644 packaging/appimage/clonim.desktop \
            "$appdir/clonim.desktop"
          install -Dm644 packaging/appimage/clonim.svg "$appdir/clonim.svg"
          ln -s clonim.svg "$appdir/.DirIcon"

          curl --fail --location --silent --show-error \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage \
            -o /tmp/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  /tmp/appimagetool-x86_64.AppImage" \
            | sha256sum --check
          chmod +x /tmp/appimagetool-x86_64.AppImage
          # Embed update information so AppImageUpdate and Gear Lever can fetch
          # GitHub's latest release. appimagetool writes the .zsync file to the
          # working directory, so run it from dist/.
          update_info="gh-releases-zsync|${GITHUB_REPOSITORY_OWNER}|${GITHUB_REPOSITORY#*/}|${UPDATE_CHANNEL}|clonim-linux-x86_64.AppImage.zsync"
          (
            cd dist
            ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 \
              /tmp/appimagetool-x86_64.AppImage \
              --updateinformation "$update_info" \
              clonim.AppDir clonim-linux-x86_64.AppImage
          )
          test -f dist/clonim-linux-x86_64.AppImage.zsync

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: clonim-${{ steps.release.outputs.tag }}-linux-x86_64
          path: |
            dist/clonim-linux-x86_64.AppImage
            dist/clonim-linux-x86_64.AppImage.zsync
          if-no-files-found: error
          retention-days: 90

      - name: Move release tag to this commit
        if: steps.release.outputs.tag == 'release'
        run: |
          git tag --force release "$GITHUB_SHA"
          git push --force origin refs/tags/release

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag == 'release' && 'Latest build from main' || steps.release.outputs.tag }}
          body: |
            Linux x86_64 ${{ steps.release.outputs.tag == 'release' && format('development build of clonim from {0}', github.sha) || 'release of clonim' }}.

            Download the AppImage, make it executable, and run it. It contains
            clonim, Nim ${{ env.NIM_VERSION }}, Zig 0.15.2 as its C compiler/linker, and clonim's
            private static runtime. It has no external build dependencies, and
            generated programs statically link the clonim runtime.

            The AppImage embeds update information, so it can be updated in
            place with AppImageUpdate (`appimageupdatetool clonim-linux-x86_64.AppImage`).
          draft: false
          prerelease: false
          make_latest: true
          files: |
            dist/clonim-linux-x86_64.AppImage
            dist/clonim-linux-x86_64.AppImage.zsync
          fail_on_unmatched_files: true
