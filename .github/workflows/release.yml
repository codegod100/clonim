name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Linux x86_64
    runs-on: ubuntu-24.04

    steps:
      - name: Resolve release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          if [[ ! "$tag" =~ ^v[0-9] ]]; then
            echo "Release tags must start with a version such as v0.1.0" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Install Nim
        run: |
          curl --fail --show-error --silent \
            https://nim-lang.org/choosenim/init.sh \
            -o /tmp/choosenim-init.sh
          CHOOSENIM_CHOOSE_VERSION=2.2.12 sh /tmp/choosenim-init.sh -y
          echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.nimble/bin:$PATH"
          nim --version

      - name: Run test suite
        run: ./run-tests.sh

      - name: Install AppImage build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes file

      - name: Build optimized compiler
        run: |
          nim c -d:release -d:releaseCompiler --hints:off --warnings:off \
            -o:bin/clonim src/clonim.nim

      - name: Package release
        run: |
          appdir=dist/clonim.AppDir
          install -Dm755 bin/clonim "$appdir/usr/bin/clonim"
          nim_lib=$(nim dump --hints:off 2>&1 | grep '^/.*\/lib$' | tail -n 1)
          test -f "$nim_lib/system.nim" || {
            echo "Unable to locate Nim's library directory" >&2
            exit 1
          }
          nim_root=$(dirname "$nim_lib")
          nim_bin="$nim_root/bin/nim"
          install -Dm755 "$nim_bin" "$appdir/usr/bin/nim"
          cp -a "$nim_lib/." "$appdir/usr/lib/"
          cp -a "$nim_root/config" "$appdir/usr/config"
          install -Dm755 packaging/appimage/gcc "$appdir/usr/bin/gcc"
          ln -s gcc "$appdir/usr/bin/cc"

          curl --fail --location --silent --show-error \
            https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz \
            -o /tmp/zig-x86_64-linux-0.15.2.tar.xz
          echo "02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239  /tmp/zig-x86_64-linux-0.15.2.tar.xz" \
            | sha256sum --check
          mkdir -p "$appdir/usr/lib/zig"
          tar --extract --xz --file /tmp/zig-x86_64-linux-0.15.2.tar.xz \
            --strip-components=1 --directory "$appdir/usr/lib/zig"

          install -Dm755 packaging/appimage/AppRun "$appdir/AppRun"
          install -Dm644 packaging/appimage/clonim.desktop \
            "$appdir/clonim.desktop"
          install -Dm644 packaging/appimage/clonim.svg "$appdir/clonim.svg"
          ln -s clonim.svg "$appdir/.DirIcon"

          curl --fail --location --silent --show-error \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage \
            -o /tmp/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  /tmp/appimagetool-x86_64.AppImage" \
            | sha256sum --check
          chmod +x /tmp/appimagetool-x86_64.AppImage
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 \
            /tmp/appimagetool-x86_64.AppImage \
            "$appdir" dist/clonim-linux-x86_64.AppImage

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: clonim-${{ steps.release.outputs.tag }}-linux-x86_64
          path: dist/clonim-linux-x86_64.AppImage
          if-no-files-found: error
          retention-days: 90

      - name: Publish Rickub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          body: |
            Linux x86_64 release of clonim.

            Download the AppImage, make it executable, and run it. It contains
            clonim, Nim 2.2.12, Zig 0.15.2 as its C compiler/linker, and clonim's
            private static runtime. It has no external build dependencies, and
            generated programs statically link the clonim runtime.
          draft: false
          prerelease: false
          files: dist/clonim-linux-x86_64.AppImage
          fail_on_unmatched_files: true
