name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Linux x86_64
    runs-on: ubuntu-24.04

    steps:
      - name: Resolve release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          if [[ ! "$tag" =~ ^v[0-9] ]]; then
            echo "Release tags must start with a version such as v0.1.0" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Install Nim
        run: |
          curl --fail --show-error --silent \
            https://nim-lang.org/choosenim/init.sh \
            -o /tmp/choosenim-init.sh
          CHOOSENIM_CHOOSE_VERSION=2.2.12 sh /tmp/choosenim-init.sh -y
          echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.nimble/bin:$PATH"
          nim --version

      - name: Run test suite
        run: ./run-tests.sh

      - name: Build optimized compiler
        run: |
          mkdir -p lib
          nim c --app:staticlib --nimMainPrefix:ClonimRuntime \
            --hints:off --warnings:off --nimcache:lib/nimcache-debug \
            -o:lib/libclonim_runtime_debug.a src/runtime_lib.nim
          nim c -d:release --app:staticlib --nimMainPrefix:ClonimRuntime \
            --hints:off --warnings:off --nimcache:lib/nimcache-release \
            -o:lib/libclonim_runtime.a src/runtime_lib.nim
          nim c -d:release -d:releaseCompiler --hints:off --warnings:off \
            -o:bin/clonim src/clonim.nim

      - name: Package release
        run: |
          appdir=dist/clonim.AppDir
          install -Dm755 bin/clonim "$appdir/usr/bin/clonim"
          install -Dm644 lib/libclonim_runtime.a \
            "$appdir/usr/bin/libclonim_runtime.a"
          install -Dm644 packaging/appimage/clonim.desktop \
            "$appdir/clonim.desktop"
          install -Dm644 packaging/appimage/clonim.svg "$appdir/clonim.svg"
          ln -s usr/bin/clonim "$appdir/AppRun"
          ln -s clonim.svg "$appdir/.DirIcon"

          curl --fail --location --silent --show-error \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage \
            -o /tmp/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  /tmp/appimagetool-x86_64.AppImage" \
            | sha256sum --check
          chmod +x /tmp/appimagetool-x86_64.AppImage
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 \
            /tmp/appimagetool-x86_64.AppImage \
            "$appdir" dist/clonim-linux-x86_64.AppImage

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: clonim-${{ steps.release.outputs.tag }}-linux-x86_64
          path: dist/clonim-linux-x86_64.AppImage
          if-no-files-found: error
          retention-days: 90

      - name: Publish Rickub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          body: |
            Linux x86_64 release of clonim.

            Download the AppImage, make it executable, and run it. It contains
            both the compiler and its private static runtime. Generated programs
            statically link the runtime and are standalone. Nim must be installed
            as the native-code backend.
          draft: false
          prerelease: false
          files: dist/clonim-linux-x86_64.AppImage
          fail_on_unmatched_files: true
